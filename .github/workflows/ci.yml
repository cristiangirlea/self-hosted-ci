name: ci

# This public repository's own checks run on GitHub's hosted runners, never on self-hosted ones:
# a pull request here can come from anyone.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
      - name: tofu fmt and validate
        working-directory: tofu
        run: |
          tofu fmt -recursive -check
          tofu init -backend=false -input=false
          tofu validate
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $errs = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            foreach ($e in $errs) { Write-Host "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: shell scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: make lint and config checks
        run: |
          make lint runners-lint
          # bash -e ignores a failure after ! and inside a && list, so each check stands alone.
          if make -s config-check 2>/dev/null; then echo "config-check passed without a config"; exit 1; fi
          printf 'GITHUB_OWNER := example\nREPOS := a\n' > /tmp/config.mk
          make -s config-check CONFIG=/tmp/config.mk
      - name: wslconfig renders defaults and per-machine values
        run: |
          make -s wslconfig > /tmp/default.ini
          grep -qx 'memory=24GB' /tmp/default.ini
          grep -qx 'processors=16' /tmp/default.ini
          # WSL reads these two only under [experimental].
          sed -n '/^\[experimental\]/,/^\[/p' /tmp/default.ini | grep -qx 'autoMemoryReclaim=dropCache'
          sed -n '/^\[experimental\]/,/^\[/p' /tmp/default.ini | grep -qx 'sparseVhd=true'
          test "$(grep '^\[' /tmp/default.ini | tail -1)" = '[wsl2]'
          if grep -q '^swapFile=' /tmp/default.ini; then echo "swapFile without WSL_SWAP_FILE"; exit 1; fi
          # Trailing spaces and a comment after a value, as people write config files.
          printf 'WSL_MEMORY := 32GB   # this PC\nWSL_PROCESSORS := 24\nWSL_SWAP_FILE := D:\\WSL\\swap.vhdx \n' > /tmp/wsl.mk
          make -s wslconfig CONFIG=/tmp/wsl.mk > /tmp/custom.ini
          grep -qx 'memory=32GB' /tmp/custom.ini
          grep -qx 'processors=24' /tmp/custom.ini
          test "$(tail -1 /tmp/custom.ini)" = 'swapFile=D:\\WSL\\swap.vhdx'
          test "$(make -s wslconfig WSL_SWAP_FILE=D:/WSL/swap.vhdx | tail -1)" = 'swapFile=D:\\WSL\\swap.vhdx'
          for bad in WSL_MEMORY=32 WSL_PROCESSORS=x WSL_SWAP_FILE=swap.vhdx 'WSL_SWAP_FILE=D:\\WSL\\swap.vhdx'; do
            if make -s wslconfig "$bad" >/dev/null 2>&1; then echo "accepted $bad"; exit 1; fi
          done
      - name: manifests render
        run: |
          kubectl kustomize apps/hello/local > /dev/null
          kubectl kustomize infrastructure/traefik > /dev/null
          # Both ConfigMaps under their fixed names: a HelmRelease's valuesFrom names them.
          test "$(kubectl kustomize flux | grep -cE '^  name: (arc-controller-values|runner-scale-set-values)$')" -eq 2
