# Traefik's default certificate: the mkcert wildcard for *.<DOMAIN>, created by `make tls`.
# The secret itself is not kept in git; encrypt it (for example with SOPS) to manage it from git.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: lab-wildcard-tls
