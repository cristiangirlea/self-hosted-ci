# The runners' values for Flux: point a Flux Kustomization at this folder and HelmReleases in
# flux-system can name these ConfigMaps in valuesFrom (README, "With Flux"). The names carry no
# hash suffix (set in each folder), so the HelmReleases do not change when a value does; helm-controller notices the
# changed ConfigMap on its next reconcile.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
resources:
  - ../infrastructure/arc
  - ../runners
